apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    # Argo 2.14 client-side schema does not know .status.terminatingReplicas
    # (newer K8s ReplicaSets); diff on the cluster side instead.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  # Multi-source: Helm chart from the public repo, values from our GitOps repo.
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 90.0.0
      helm:
        valueFiles:
          - $values/apps/monitoring/values.yaml
    - repoURL: https://github.com/Western-1/enterprise-aks-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      # Server-side apply: client-side apply stores the whole object in the
      # last-applied annotation, which overflows the 256KB limit on the
      # prometheus-operator CRDs.
      - ServerSideApply=true