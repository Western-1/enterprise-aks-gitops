# Zero-trust network posture: everything is denied by default,
# only the flows below are explicitly allowed.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: media
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS (kube-dns in kube-system) for all workloads
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: media
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# api + worker -> Azure Database for PostgreSQL (private endpoint subnet)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-egress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: media
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.3.0/24
      ports:
        - protocol: TCP
          port: 5432
---
# api + worker -> redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-egress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: media
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
---
# redis accepts connections only from api + worker
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: media
      ports:
        - protocol: TCP
          port: 6379
---
# the API is reachable from outside on its container port;
# everything else stays closed
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: media
      role: api
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000