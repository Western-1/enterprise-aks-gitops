# Creates the "media" database once using the workload identity token
# (the flexible server itself is provisioned by Terraform)
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: media
  annotations:
    # PreSync hook: a fresh Job every sync (Job pod templates are immutable,
    # and Argo Replace does not work for Jobs). The bootstrap script is
    # idempotent ("already exists" exits 0), old hook Jobs are deleted.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded, BeforeHookCreation
spec:
  template:
    metadata:
      labels:
        app: media
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: media-api
      containers:
        - name: init
          image: acrdevmedia.azurecr.io/media-api:sha-6113057
          command: ["python", "scripts/db-bootstrap.py"]
          env:
            - name: AZURE_CLIENT_ID
              value: "2308ae95-bf08-486f-8dbe-56315fab638c"
            - name: DB_HOST
              value: psql-dev-media-ne.postgres.database.azure.com
            - name: DB_USER
              value: uami-media-dev-ne
            - name: DB_NAME
              value: media
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi