# Creates the "media" database once (the flexible server itself is provisioned by Terraform)
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: media-api
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: media-db-credentials
      containers:
        - name: init
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: media-db
          command: ["/bin/sh", "-c"]
          args:
            - |
              ADMIN_URL=$(echo "$DATABASE_URL" | sed 's|/media$|/postgres|')
              if PGPASSWORD="$DBPASSWORD" psql "$ADMIN_URL" -tAc "SELECT 1 FROM pg_database WHERE datname='media'" | grep -q 1; then
                echo "database 'media' already exists"
              else
                PGPASSWORD="$DBPASSWORD" psql "$ADMIN_URL" -c "CREATE DATABASE media;"
                echo "database 'media' created"
              fi
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true