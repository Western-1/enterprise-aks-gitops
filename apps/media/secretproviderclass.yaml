# Reads db credentials from Key Vault using Workload Identity
# (managed identity uami-media-dev-ne, federated with the media-api service account)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: media-db-credentials
  namespace: media
spec:
  provider: azure
  parameters:
    usePodIdentity: false
    useVMManagedIdentity: true
    userAssignedIdentityID: "2308ae95-bf08-486f-8dbe-56315fab638c"
    keyvaultName: kv-dev-media-ne
    objects: |
      array:
        - |
          objectName: db-url
          objectType: secret
        - |
          objectName: db-password
          objectType: secret
  secretObjects:
    - secretName: media-db
      type: Opaque
      data:
        - objectName: db-url
          key: DATABASE_URL
        - objectName: db-password
          key: DBPASSWORD