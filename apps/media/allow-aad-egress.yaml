# Allows media pods to reach the Microsoft Entra ID token endpoint
# (login.microsoftonline.com) over HTTPS so the workload identity can be
# exchanged for a PostgreSQL access token.
#
# NOTE: this deliberately allows TCP 443 to 0.0.0.0/0. Pinning the rule to
# login.microsoftonline.com IPs is not stable (global CDN, rotating A records),
# and the Cilium FQDN policy we tried first (CiliumNetworkPolicy/toFQDNs) did
# not open the egress in this AKS BYOCNI setup — DNS-based learning never
# programmed the allow rule, connections timed out. Follow-up: re-evaluate
# FQDN policies on a newer Cilium or use egress gateways with static IPs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aad-egress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: media
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0