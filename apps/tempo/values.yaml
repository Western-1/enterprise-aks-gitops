# Single-binary Tempo, local storage. Receivers default to OTLP;
# the override below pins it explicitly.
persistence:
  enabled: true
  size: 5Gi
tempo:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi