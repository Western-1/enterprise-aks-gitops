# Tuned for 2 x 2CPU/15GB system nodes shared with workloads.
# No public exposure: Grafana stays ClusterIP (port-forward does not work
# on this Cilium cluster, use in-cluster checks, see docs/playbook.md).
alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    # Discover ServiceMonitors without requiring the release label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

grafana:
  # Admin password is generated by the chart and stored in the
  # monitoring/monitoring-grafana secret (read it with kubectl when needed).
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Keep the small exporters on defaults; they fit the nodes.
kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi